<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="newTabTitle">New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- два слоя фона: новый проявляется поверх старого -->
  <div class="bg-layer" id="bgA"></div>
  <div class="bg-layer" id="bgB"></div>

  <button id="settingsBtn" class="settings-btn" data-i18n-title="settings">⚙</button>

  <main>
    <form id="searchForm" class="search">
      <input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" autocomplete="off" autofocus>
    </form>
    <div id="grid" class="grid"></div>
  </main>

  <!-- Добавление / редактирование плитки -->
  <dialog id="tileDialog">
    <form method="dialog" id="tileForm">
      <h2 id="tileDialogTitle"></h2>
      <label><span data-i18n="fieldUrl"></span>
        <input name="url" type="text" required placeholder="example.com">
      </label>
      <label><span data-i18n="fieldTitle"></span>
        <input name="title" type="text" data-i18n-placeholder="optional">
      </label>
      <label><span data-i18n="fieldImage"></span>
        <input name="image" type="text" data-i18n-placeholder="imagePlaceholder">
      </label>
      <label class="check" id="removeShotRow" hidden>
        <input name="removeShot" type="checkbox"> <span data-i18n="removeShot"></span>
      </label>
      <menu>
        <button class="btn" value="cancel" formnovalidate data-i18n="cancel"></button>
        <button class="btn primary" value="ok" data-i18n="save"></button>
      </menu>
    </form>
  </dialog>

  <!-- Настройки -->
  <dialog id="settingsDialog">
    <form method="dialog">
      <h2 data-i18n="settings"></h2>
      <label><span data-i18n="columns"></span> <output id="colsOut"></output>
        <input id="cols" type="range" min="3" max="10" step="1">
      </label>
      <label><span data-i18n="tileSize"></span> <output id="sizeOut"></output>
        <input id="size" type="range" min="120" max="280" step="10">
      </label>
      <label class="check">
        <input id="showTitles" type="checkbox"> <span data-i18n="showTitles"></span>
      </label>
      <fieldset class="section">
        <legend><span data-i18n="backgrounds"></span> <span id="bgCount" class="count"></span></legend>
        <div id="bgList" class="bg-list"></div>
        <p id="bgEmpty" class="hint" data-i18n="bgEmpty"></p>
        <div class="row">
          <button type="button" class="btn" id="bgAdd" data-i18n="addBackgrounds"></button>
          <button type="button" class="btn" id="bgClear" data-i18n="removeAllBackgrounds"></button>
          <input id="bgFile" type="file" accept="image/*" multiple hidden>
        </div>
        <p id="bgBusy" class="hint" hidden></p>

        <div id="bgRotation">
          <label class="inline"><span data-i18n="bgChange"></span>
            <select id="bgMode">
              <option value="tab" data-i18n="bgModeTab"></option>
              <option value="interval" data-i18n="bgModeInterval"></option>
            </select>
          </label>
          <label class="inline" id="bgIntervalRow"><span data-i18n="bgEvery"></span>
            <input id="bgInterval" type="number" min="1" max="10080" step="1">
            <span data-i18n="minutesShort"></span>
            <span id="bgIntervalHint" class="hint"></span>
          </label>
          <label class="inline"><span data-i18n="bgOrder"></span>
            <select id="bgOrder">
              <option value="sequential" data-i18n="bgOrderSequential"></option>
              <option value="random" data-i18n="bgOrderRandom"></option>
            </select>
          </label>
        </div>
        <p id="bgOneNote" class="hint" data-i18n="bgNeedTwo"></p>
      </fieldset>

      <fieldset class="section">
        <legend data-i18n="backup"></legend>
        <div class="row">
          <button type="button" class="btn" id="exportBtn" data-i18n="export"></button>
          <button type="button" class="btn" id="importBtn" data-i18n="import"></button>
          <input id="importFile" type="file" accept="application/json" hidden>
        </div>
        <label class="check"><input id="exportBgs" type="checkbox"> <span data-i18n="exportBackgrounds"></span></label>
      </fieldset>
      <menu>
        <button class="btn primary" value="close" data-i18n="done"></button>
      </menu>
    </form>
  </dialog>

  <script src="defaults.js"></script>
  <script src="bgstore.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
